services:
  v2rs-nginx:
    image: nginx:1.28
    container_name: v2rs-nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./frontend/privkey.key:/etc/nginx/ssl/privkey.key:ro
    networks:
      - v2rs-network
  v2rs:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        - VERSION=latest
        - REVISION=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        - XRAY_WASM_URL=${XRAY_WASM_URL:-https://adam-sizzler.github.io/s-validator/main.wasm}
        - XRAY_SCHEMA_URL=${XRAY_SCHEMA_URL:-https://adam-sizzler.github.io/s-validator/singbox.schema.json}
        - XRAY_SCHEMA_CN_URL=${XRAY_SCHEMA_CN_URL:-https://adam-sizzler.github.io/s-validator/singbox.schema.json}
    image: v2rs:latest
    container_name: v2rs
    hostname: v2rs
    restart: always
    env_file:
      - ./config/env/panel.env
    networks:
      - v2rs-network
    ports:
      - 127.0.0.1:9242:9242
      - 127.0.0.1:9243:9243
    volumes:
      - panel-data:/app/data
    depends_on:
      v2rs-db:
        condition: service_healthy
      v2rs-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 5

  v2rs-db:
    image: postgres:17.6
    container_name: v2rs-db
    hostname: v2rs-db
    restart: always
    env_file:
      - ./config/env/infra.env
    networks:
      - v2rs-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - TZ=UTC
    ports:
      - 127.0.0.1:6868:5432
    volumes:
      - v2rs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 5

  v2rs-redis:
    image: valkey/valkey:8.1-alpine
    container_name: v2rs-redis
    hostname: v2rs-redis
    restart: always
    networks:
      - v2rs-network
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 5

  v2rs-subscription-page:
    build:
      context: ../../projectSB/v2ray-stat-sub
      dockerfile: Dockerfile
    image: v2rs-subscription-page:local
    container_name: v2rs-subscription-page
    hostname: v2rs-subscription-page
    restart: always
    env_file:
      - ./config/env/subscription.env
    ports:
      - 127.0.0.1:3010:3010
    networks:
      - v2rs-network
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 5

networks:
  v2rs-network:
    name: v2rs-network
    driver: bridge

volumes:
  panel-data:
    name: panel-data
  v2rs-db-data:
    name: v2rs-db-data
