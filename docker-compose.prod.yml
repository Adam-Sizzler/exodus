# Production Docker Compose configuration for V2Ray-Stat
# Использование: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - VERSION=${VERSION:-latest}
    image: v2ray-stat-backend:${VERSION:-latest}
    container_name: v2ray-stat-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-9243}:9243"
    volumes:
      - ${CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
      - backend-data:/app/data
      - ${CERTS_PATH:-./certs}:/app/certs:ro
      - backend-logs:/var/log
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - v2ray-stat-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9243/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      subscription:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        - VERSION=${VERSION:-latest}
    image: v2ray-stat-node:${VERSION:-latest}
    container_name: v2ray-stat-node
    restart: always
    ports:
      - "${NODE_PORT:-9253}:9253"
    volumes:
      - ${CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
      - ${CERTS_PATH:-./certs}:/app/certs:ro
      - ${XRAY_CONFIG_PATH:-/usr/local/etc/xray}:/app/xray:ro
      - ${XRAY_CONFIG_PATH:-/usr/local/etc/xray}/access.log:/app/logs/access.log:ro
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - v2ray-stat-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "pgrep", "-f", "v2ray-stat-node"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

  subscription:
    build:
      context: .
      dockerfile: Dockerfile.subscription
      args:
        - VERSION=${VERSION:-latest}
    image: v2ray-stat-subscription:${VERSION:-latest}
    container_name: v2ray-stat-subscription
    restart: always
    ports:
      - "${SUBSCRIPTION_HTTP_PORT:-9264}:9264"
      - "${SUBSCRIPTION_GRPC_PORT:-9263}:9263"
    volumes:
      - ${CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
      - ${CERTS_PATH:-./certs}:/app/certs:ro
      - ./subscription/templates:/app/templates:ro
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - v2ray-stat-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9264/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

networks:
  v2ray-stat-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-v2ray
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}
    labels:
      com.v2ray-stat.network: "true"

volumes:
  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
  backend-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./logs}
