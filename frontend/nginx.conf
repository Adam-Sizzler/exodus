upstream exodus_panel {
    server exodus:3000;
}

upstream exodus_subscription_page {
    server exodus-subscription-page:3010;
}

server {
    listen 443 ssl;
    server_name _ localhost panel.localhost 172.21.152.221;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://exodus_panel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name subka.localhost;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    location / {
        if ($http_user_agent ~* "v2raytun|karing|nekoray|throne|nekobox|hiddify") {
            return 404;
        }

        proxy_http_version 1.1;
        proxy_pass http://exodus_subscription_page;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
