x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - exodus-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file:
    - ./.env

services:
  exodus:
    build:
      context: .
      dockerfile: Dockerfile.panel
    image: exodus:latest
    container_name: exodus
    hostname: exodus
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT=${APP_PORT:-3000}
      - APP_PATH=${APP_PATH:-/panel}
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}
    volumes:
      - panel-data:/app/data
    depends_on:
      exodus-db:
        condition: service_healthy
      exodus-redis:
        condition: service_healthy

  exodus-node:
    build:
      context: ../node
      dockerfile: Dockerfile.node
    image: exodus-node:latest
    container_name: exodus-node
    hostname: exodus-node
    <<: [*common, *logging]
    ports:
      - "9253:9253"
    volumes:
      - ./backend/node/config.yml:/app/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  exodus-subscription:
    build:
      context: ../exodus-sub
      dockerfile: Dockerfile
    image: exodus-subscription:latest
    container_name: exodus-subscription
    hostname: exodus-subscription
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT_SUB=${APP_PORT_SUB:-3010}
      - SUB_GRPC_ADDRESS=${SUB_GRPC_ADDRESS:-0.0.0.0}
      - SUB_GRPC_PORT=${SUB_GRPC_PORT:-2222}
      - SUB_GRPC_PATH=${SUB_GRPC_PATH:-/}
    ports:
      - 127.0.0.1:${APP_PORT_SUB:-3010}:${APP_PORT_SUB:-3010}
    depends_on:
      exodus:
        condition: service_started

  exodus-db:
    image: postgres:17.6
    container_name: exodus-db
    hostname: exodus-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
    ports:
      - 127.0.0.1:6868:5432
    volumes:
      - exodus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  exodus-redis:
    image: valkey/valkey:8.1-alpine
    container_name: exodus-redis
    hostname: exodus-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

networks:
  exodus-network:
    name: exodus-network
    driver: bridge
    external: false

volumes:
  panel-data:
    name: panel-data
    driver: local
  exodus-db-data:
    name: exodus-db-data
    driver: local
    external: false
