services:
  exodus-subscription:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/adam-sizzler/exodus-subscription:latest
    container_name: exodus-subscription
    hostname: exodus-subscription
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:${SUB_APP_PORT:-3333}:${SUB_APP_PORT:-3333}'
      - '127.0.0.1:${SUB_GRPC_PORT:-3334}:${SUB_GRPC_PORT:-3334}'

