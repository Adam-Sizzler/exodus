x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - v2rs-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file:
    - ./.env

services:
  v2rs:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        - XRAY_WASM_URL=${XRAY_WASM_URL:-https://adam-sizzler.github.io/s-validator/main.wasm}
        - XRAY_SCHEMA_URL=${XRAY_SCHEMA_URL:-https://adam-sizzler.github.io/s-validator/singbox.schema.json}
        - XRAY_SCHEMA_CN_URL=${XRAY_SCHEMA_CN_URL:-https://adam-sizzler.github.io/s-validator/singbox.schema.json}
    image: v2rs:latest
    container_name: v2rs
    hostname: v2rs
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT=${APP_PORT:-9242}
      - BACKEND_PORT=${BACKEND_PORT:-9243}
    ports:
      - 127.0.0.1:${APP_PORT:-9242}:${APP_PORT:-9242}
      - 127.0.0.1:${BACKEND_PORT:-9243}:${BACKEND_PORT:-9243}
    volumes:
      - panel-data:/app/data
    depends_on:
      v2rs-db:
        condition: service_healthy
      v2rs-redis:
        condition: service_healthy

  v2rs-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: v2rs-node:latest
    container_name: v2rs-node
    hostname: v2rs-node
    <<: [*common, *logging]
    ports:
      - "9253:9253"
    volumes:
      - ./backend/node/config.yml:/app/config.yml:ro
      - ./xray:/app/xray:ro
      - ./xray/access.log:/app/logs/access.log:ro

  v2rs-subscription:
    build:
      context: .
      dockerfile: Dockerfile.subscription
    image: v2rs-subscription:latest
    container_name: v2rs-subscription
    hostname: v2rs-subscription
    <<: [*common, *logging]
    ports:
      - "9264:9264"
      - "9263:9263"
    volumes:
      - ./backend/subscription/config.yml:/app/config.yml:ro
      - ./backend/subscription/templates:/app/templates:ro

  v2rs-db:
    image: postgres:17.6
    container_name: v2rs-db
    hostname: v2rs-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
    ports:
      - 127.0.0.1:6868:5432
    volumes:
      - v2rs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  v2rs-redis:
    image: valkey/valkey:8.1-alpine
    container_name: v2rs-redis
    hostname: v2rs-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

networks:
  v2rs-network:
    name: v2rs-network
    driver: bridge
    external: false

volumes:
  panel-data:
    name: panel-data
    driver: local
  v2rs-db-data:
    name: v2rs-db-data
    driver: local
    external: false
