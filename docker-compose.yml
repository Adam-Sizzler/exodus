services:
  exodus-subscription:
    image: ghcr.io/adam-sizzler/exodus-subscription:latest
    container_name: exodus-subscription
    hostname: exodus-subscription
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:${SUB_APP_PORT:-3010}:${SUB_APP_PORT:-3010}'
      - '127.0.0.1:${SUB_GRPC_PORT:-3011}:${SUB_GRPC_PORT:-3011}'
