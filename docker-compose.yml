x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - cerberus-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file:
    - ./.env

services:
  cerberus:
    build:
      context: .
      dockerfile: Dockerfile.panel
    image: cerberus:latest
    container_name: cerberus
    hostname: cerberus
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT=${APP_PORT:-3000}
      - APP_PATH=${APP_PATH:-/panel}
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}
    volumes:
      - panel-data:/app/data
    depends_on:
      cerberus-db:
        condition: service_healthy
      cerberus-redis:
        condition: service_healthy

  cerberus-node:
    build:
      context: ../cerberus-node
      dockerfile: Dockerfile.node
    image: cerberus-node:latest
    container_name: cerberus-node
    hostname: cerberus-node
    <<: [*common, *logging]
    ports:
      - "9253:9253"
    volumes:
      - ./backend/node/config.yml:/app/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  cerberus-subscription:
    build:
      context: ../cerberus-sub
      dockerfile: Dockerfile
    image: cerberus-subscription:latest
    container_name: cerberus-subscription
    hostname: cerberus-subscription
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT_SUB=${APP_PORT_SUB:-3010}
      - CUSTOM_SUB_PREFIX=${CUSTOM_SUB_PREFIX:-}
    ports:
      - 127.0.0.1:${APP_PORT_SUB:-3010}:${APP_PORT_SUB:-3010}
    depends_on:
      cerberus:
        condition: service_started

  cerberus-db:
    image: postgres:17.6
    container_name: cerberus-db
    hostname: cerberus-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
    ports:
      - 127.0.0.1:6868:5432
    volumes:
      - cerberus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  cerberus-redis:
    image: valkey/valkey:8.1-alpine
    container_name: cerberus-redis
    hostname: cerberus-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

networks:
  cerberus-network:
    name: cerberus-network
    driver: bridge
    external: false

volumes:
  panel-data:
    name: panel-data
    driver: local
  cerberus-db-data:
    name: cerberus-db-data
    driver: local
    external: false
