x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - exodus-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file:
    - path: ./.env
      required: false

services:
  exodus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${EXODUS_VERSION:-latest}
        REVISION: ${EXODUS_REVISION:-unknown}
        FRONTEND_REVISION: ${EXODUS_FRONTEND_COMMIT:-unknown}
        BUILD_BRANCH: ${EXODUS_GIT_BRANCH:-unknown}
        BUILD_TIME: ${EXODUS_BUILD_TIME:-unknown}
        BUILD_NUMBER: ${EXODUS_BUILD_NUMBER:-unknown}
        REPOSITORY_URL: ${EXODUS_REPOSITORY_URL:-unknown}
    image: exodus:latest
    container_name: exodus
    hostname: exodus
    <<: [*common, *logging, *env]
    environment:
      - APP_PORT=${APP_PORT:-3000}
      - APP_PATH=${APP_PATH:-/panel}
      - EXODUS_ALLOW_INSECURE_HTTP=${EXODUS_ALLOW_INSECURE_HTTP:-true}
      - EXODUS_TRUSTED_PROXIES=${EXODUS_TRUSTED_PROXIES:-127.0.0.1/32,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@exodus-db:5432/postgres}
      - REDIS_HOST=${REDIS_HOST:-exodus-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}
    volumes:
      - panel-data:/app/data
    depends_on:
      exodus-db:
        condition: service_healthy
      exodus-redis:
        condition: service_healthy

  exodus-node:
    build:
      context: ../exodus-node
      dockerfile: Dockerfile
    image: exodus-node:latest
    container_name: exodus-node
    hostname: exodus-node
    <<: [*common, *logging]
    ports:
      - "9253:9253"
    volumes:
      - ./backend/node/config.yml:/app/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  exodus-subscription:
    build:
      context: ../exodus-subscription
      dockerfile: Dockerfile
    image: exodus-subscription:latest
    container_name: exodus-subscription
    hostname: exodus-subscription
    <<: [*common, *logging, *env]
    env_file:
      - path: ./.env
        required: false
      - path: ../exodus-subscription/.env
        required: false
    environment:
      - APP_PORT_SUB=${APP_PORT_SUB:-3010}
      - SUB_GRPC_ADDRESS=${SUB_GRPC_ADDRESS:-0.0.0.0}
      - SUB_GRPC_PORT=${SUB_GRPC_PORT:-2222}
      - SUB_GRPC_PATH=${SUB_GRPC_PATH:-/}
    ports:
      - 127.0.0.1:${APP_PORT_SUB:-3010}:${APP_PORT_SUB:-3010}
    depends_on:
      exodus:
        condition: service_started

  exodus-db:
    image: postgres:18
    container_name: exodus-db
    hostname: exodus-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
    ports:
      - 127.0.0.1:6868:5432
    volumes:
      - exodus-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  exodus-redis:
    image: valkey/valkey:8.1-alpine
    container_name: exodus-redis
    hostname: exodus-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

networks:
  exodus-network:
    name: exodus-network
    driver: bridge
    external: false

volumes:
  panel-data:
    name: panel-data
    driver: local
  exodus-data:
    name: exodus-data
    driver: local
    external: false
