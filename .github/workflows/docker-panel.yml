name: Build And Push Panel Image

on:
  push:
    tags:
      - '*'

jobs:
  docker-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerberus
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Resolve build metadata
        id: build_meta
        run: |
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "repository_url=${REPOSITORY_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            REVISION=${{ steps.build_meta.outputs.revision }}
            FRONTEND_REVISION=${{ steps.build_meta.outputs.frontend_revision }}
            BUILD_BRANCH=${{ steps.build_meta.outputs.branch }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            BUILD_NUMBER=${{ steps.build_meta.outputs.build_number }}
            REPOSITORY_URL=${{ steps.build_meta.outputs.repository_url }}
