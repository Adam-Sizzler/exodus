name: Build And Push Panel Image

on:
  push:
    tags:
      - '*'

jobs:
  docker-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Send Telegram start notification
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: TELEGRAM_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi

          TEXT="🚀 <b>Panel image build started</b>

          <b>Repository:</b> ${GITHUB_REPOSITORY}
          <b>Tag:</b> ${GITHUB_REF_NAME}
          <b>Commit:</b> ${GITHUB_SHA}
          <b>Workflow:</b> ${GITHUB_WORKFLOW}
          <b>Run:</b> ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          ARGS=(
            -sS
            -X POST
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
            -d "chat_id=${TELEGRAM_CHAT_ID}"
            -d "parse_mode=HTML"
            --data-urlencode "text=${TEXT}"
          )

          if [ -n "${TELEGRAM_TOPIC_ID}" ]; then
            ARGS+=(-d "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          curl "${ARGS[@]}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/exodus
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Resolve build metadata
        id: build_meta
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          git fetch --force --prune origin "+refs/heads/*:refs/remotes/origin/*"

          BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
            | sed 's#^origin/##' \
            | grep -Fx "${DEFAULT_BRANCH}" \
            | head -n 1 || true)"

          if [ -z "${BRANCH}" ]; then
            BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
              | sed 's#^origin/##' \
              | grep -v '^HEAD$' \
              | head -n 1 || true)"
          fi

          if [ -z "${BRANCH}" ]; then
            BRANCH="${DEFAULT_BRANCH:-unknown}"
          fi

          echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "repository_url=${REPOSITORY_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            REVISION=${{ steps.build_meta.outputs.revision }}
            FRONTEND_REVISION=${{ steps.build_meta.outputs.frontend_revision }}
            BUILD_BRANCH=${{ steps.build_meta.outputs.branch }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            BUILD_NUMBER=${{ steps.build_meta.outputs.build_number }}
            REPOSITORY_URL=${{ steps.build_meta.outputs.repository_url }}

      - name: Send Telegram success notification
        if: success()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: TELEGRAM_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi

          TEXT="✅ <b>Panel image build finished successfully</b>

          <b>Repository:</b> ${GITHUB_REPOSITORY}
          <b>Tag:</b> ${GITHUB_REF_NAME}
          <b>Image:</b> ghcr.io/${{ github.repository_owner }}/exodus:${GITHUB_REF_NAME}
          <b>Latest:</b> ghcr.io/${{ github.repository_owner }}/exodus:latest
          <b>Commit:</b> ${GITHUB_SHA}
          <b>Run:</b> ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          ARGS=(
            -sS
            -X POST
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
            -d "chat_id=${TELEGRAM_CHAT_ID}"
            -d "parse_mode=HTML"
            --data-urlencode "text=${TEXT}"
          )

          if [ -n "${TELEGRAM_TOPIC_ID}" ]; then
            ARGS+=(-d "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          curl "${ARGS[@]}"

      - name: Send Telegram failure notification
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: TELEGRAM_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi

          TEXT="❌ <b>Panel image build failed</b>

          <b>Repository:</b> ${GITHUB_REPOSITORY}
          <b>Tag:</b> ${GITHUB_REF_NAME}
          <b>Commit:</b> ${GITHUB_SHA}
          <b>Workflow:</b> ${GITHUB_WORKFLOW}
          <b>Run:</b> ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          ARGS=(
            -sS
            -X POST
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
            -d "chat_id=${TELEGRAM_CHAT_ID}"
            -d "parse_mode=HTML"
            --data-urlencode "text=${TEXT}"
          )

          if [ -n "${TELEGRAM_TOPIC_ID}" ]; then
            ARGS+=(-d "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          curl "${ARGS[@]}"
