name: Build And Push Panel Image

on:
  push:
    tags:
      - '*'

jobs:
  docker-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerberus
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Resolve build metadata
        id: build_meta
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --force --prune origin "+refs/heads/*:refs/remotes/origin/*"
          BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
            | sed 's#^origin/##' \
            | grep -Fx "${DEFAULT_BRANCH}" \
            | head -n 1 || true)"
          if [ -z "${BRANCH}" ]; then
            BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
              | sed 's#^origin/##' \
              | grep -v '^HEAD$' \
              | head -n 1 || true)"
          fi
          if [ -z "${BRANCH}" ]; then
            BRANCH="${DEFAULT_BRANCH:-unknown}"
          fi

          echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "repository_url=${REPOSITORY_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            REVISION=${{ steps.build_meta.outputs.revision }}
            FRONTEND_REVISION=${{ steps.build_meta.outputs.frontend_revision }}
            BUILD_BRANCH=${{ steps.build_meta.outputs.branch }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            BUILD_NUMBER=${{ steps.build_meta.outputs.build_number }}
            REPOSITORY_URL=${{ steps.build_meta.outputs.repository_url }}
