name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write

    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]
        build_tags: [journald]
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 1
      BUILD_TAGS: ${{ matrix.build_tags }}

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsqlite3-dev
          if [ "${BUILD_TAGS}" != "nojournald" ]; then
            sudo apt-get install -y libsystemd-dev
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Calculate build info
        id: build_info
        run: |
          REVISION=$(git rev-parse HEAD)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          BUILD_TAGS=${{ matrix.build_tags }}
          if [ -z "$BUILD_TAGS" ]; then BUILD_TAGS="none"; fi
          echo "build_tags=$BUILD_TAGS" >> $GITHUB_OUTPUT
          CGO_ENABLED=${CGO_ENABLED:-0}
          if [ "$CGO_ENABLED" == "1" ]; then CGO_STATUS="enabled"; else CGO_STATUS="disabled"; fi
          echo "cgo_enabled=$CGO_STATUS" >> $GITHUB_OUTPUT

      - name: Build v2ray-stat-backend
        run: |
          VERSION=${{ github.ref_name }}
          REVISION=${{ steps.build_info.outputs.revision }}
          BUILD_TAGS=${{ steps.build_info.outputs.build_tags }}
          CGO_ENABLED_STATUS=${{ steps.build_info.outputs.cgo_enabled }}
          BINARY_NAME="v2rs-backend-${GOOS}-${GOARCH}"

          go build -o build_assets/$BINARY_NAME \
            -trimpath \
            -buildvcs=true \
            -ldflags="-X v2ray-stat/constant.Version=$VERSION \
                      -X v2ray-stat/constant.Revision=$REVISION \
                      -X v2ray-stat/constant.BuildTags=$BUILD_TAGS \
                      -X v2ray-stat/constant.CgoEnabled=$CGO_ENABLED_STATUS \
                      -s -w -buildid=" \
            -v ./backend/main.go

      - name: Build v2rs-node
        run: |
          VERSION=${{ github.ref_name }}
          REVISION=${{ steps.build_info.outputs.revision }}
          BUILD_TAGS=${{ steps.build_info.outputs.build_tags }}
          CGO_ENABLED_STATUS=${{ steps.build_info.outputs.cgo_enabled }}
          BINARY_NAME="v2rs-node-${GOOS}-${GOARCH}"

          echo "Building $BINARY_NAME with tags: ${{ matrix.build_tags }}..."
          go build -o build_assets/$BINARY_NAME \
            -tags "${{ matrix.build_tags }}" \
            -trimpath \
            -buildvcs=true \
            -ldflags="-X v2ray-stat/constant.Version=$VERSION \
                      -X v2ray-stat/constant.Revision=$REVISION \
                      -X v2ray-stat/constant.BuildTags=$BUILD_TAGS \
                      -X v2ray-stat/constant.CgoEnabled=$CGO_ENABLED_STATUS \
                      -s -w -buildid=" \
            -v ./node/main.go

      - name: Build v2rs-sub
        run: |
          VERSION=${{ github.ref_name }}
          REVISION=${{ steps.build_info.outputs.revision }}
          BUILD_TAGS=${{ steps.build_info.outputs.build_tags }}
          CGO_ENABLED_STATUS=${{ steps.build_info.outputs.cgo_enabled }}
          BINARY_NAME="v2rs-sub-${GOOS}-${GOARCH}"

          echo "Building $BINARY_NAME..."
          go build -o build_assets/$BINARY_NAME \
            -trimpath \
            -buildvcs=true \
            -ldflags="-X v2ray-stat/constant.Version=$VERSION \
                      -X v2ray-stat/constant.Revision=$REVISION \
                      -X v2ray-stat/constant.BuildTags=$BUILD_TAGS \
                      -X v2ray-stat/constant.CgoEnabled=$CGO_ENABLED_STATUS \
                      -s -w -buildid=" \
            -v ./subscription/main.go

      - name: Copy additional files
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/v2ray-manager.sh ./build_assets/v2ray-manager.sh

      - name: Create checksums
        run: |
          cd build_assets
          sha256sum * > checksums.txt

      - name: Upload assets to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build_assets/**
          file_glob: true
          tag: ${{ github.ref_name }}
          overwrite: true
