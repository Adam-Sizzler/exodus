name: Build And Push Panel Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for Docker image, for example v1.2.3"
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  send-start-deploy-telegram-message:
    name: Send Telegram message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build started'

  build-docker-image:
    runs-on: ubuntu-latest
    needs: [send-start-deploy-telegram-message]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            BRANCH="${GITHUB_REF_NAME:-${DEFAULT_BRANCH:-unknown}}"
          else
            VERSION="${GITHUB_REF_NAME}"
            git fetch --force --prune origin "+refs/heads/*:refs/remotes/origin/*"
            BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
              | sed 's#^origin/##' \
              | grep -Fx "${DEFAULT_BRANCH}" \
              | head -n 1 || true)"
            if [ -z "${BRANCH}" ]; then
              BRANCH="$(git for-each-ref --format='%(refname:short)' --contains "${GITHUB_SHA}" refs/remotes/origin \
                | sed 's#^origin/##' \
                | grep -v '^HEAD$' \
                | head -n 1 || true)"
            fi
            if [ -z "${BRANCH}" ]; then
              BRANCH="${DEFAULT_BRANCH:-unknown}"
            fi
          fi

          VERSION="$(printf '%s' "${VERSION}" | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "Version must not be empty" >&2
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Version must be a valid Docker tag, for example v1.2.3 or 1.2.3" >&2
            exit 1
          fi

          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="ghcr.io/${OWNER_LC}/exodus"
          IMAGE_VERSION="${IMAGE_BASE}:${VERSION}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "repository_url=${REPOSITORY_URL}" >> "${GITHUB_OUTPUT}"
          echo "image_base=${IMAGE_BASE}" >> "${GITHUB_OUTPUT}"
          echo "image_version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_latest=${IMAGE_LATEST}" >> "${GITHUB_OUTPUT}"

          {
            echo "image_tags<<EOF_TAGS"
            echo "${IMAGE_VERSION}"
            echo "${IMAGE_LATEST}"
            echo "EOF_TAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
          labels: |
            org.opencontainers.image.title=exodus
            org.opencontainers.image.description=Exodus panel image
            org.opencontainers.image.url=${{ steps.meta.outputs.repository_url }}
            org.opencontainers.image.source=${{ steps.meta.outputs.repository_url }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
            FRONTEND_REVISION=${{ steps.meta.outputs.frontend_revision }}
            BUILD_BRANCH=${{ steps.meta.outputs.branch }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            REPOSITORY_URL=${{ steps.meta.outputs.repository_url }}

  send-telegram-message:
    name: Send Telegram message
    needs: [build-docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: success
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build finished'

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: error
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build failed'
