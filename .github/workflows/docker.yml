name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [panel, subscription, node]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Fetch tags
        run: git fetch --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/v2ray-stat-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Calculate build info
        id: build_info
        run: |
          REVISION=$(git rev-parse HEAD)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          BUILD_TAGS=none
          echo "build_tags=$BUILD_TAGS" >> $GITHUB_OUTPUT
          CGO_ENABLED=1
          CGO_STATUS="enabled"
          echo "cgo_enabled=$CGO_STATUS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.component }}
          #,linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ steps.build_info.outputs.revision }}
            BUILD_TAGS=${{ steps.build_info.outputs.build_tags }}
            CGO_ENABLED_STATUS=${{ steps.build_info.outputs.cgo_enabled }}
